name: WPB Daily Inventory Scrape

on:
  schedule:
    - cron: '1 10 * * *'
    - cron: '1 19 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Prepare workspace
        run: |
          echo "Scraper will load history directly from GitHub API"
          echo "{}" > history.json

      
      - name: Run inventory scraper (with retry)
        env:
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            echo "Scraper attempt $attempt of 3..."
            node scrape.js && break
            if [ $attempt -lt 3 ]; then
              echo "Attempt $attempt failed, waiting 60s before retry..."
              sleep 60
            else
              echo "All 3 attempts failed"
              exit 1
            fi
          done

      - name: Run FB Marketplace scraper
        if: github.event.schedule == '1 10 * * *' || github.event_name == 'workflow_dispatch'
        run: node fb-scraper.js

      - name: Run FB sync check
        if: github.event.schedule == '1 10 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -f "fb-listings.json" ]; then node fb-check.js; else echo "fb-listings.json not found - skipping"; fi

      - name: Push history.json to repo via API
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 -c "
import urllib.request, json, base64, os, sys

token = os.environ['GH_TOKEN']
repo  = os.environ['GITHUB_REPOSITORY']

with open('history.json', 'rb') as f:
    raw = f.read()

history = json.loads(raw)
all_keys = sorted(history.keys())
by_day = {}
for k in all_keys:
    by_day[k[:10]] = k
daily_keys = sorted(by_day.values())[-20:]
slim = {k: history[k] for k in daily_keys}
slim_raw = json.dumps(slim).encode()
print(f'Pushing {len(slim)} snapshots ({len(slim_raw)/1024/1024:.1f}MB)...')

req = urllib.request.Request(
    f'https://api.github.com/repos/{repo}/contents/history.json',
    headers={'Authorization': f'token {token}', 'Accept': 'application/vnd.github.v3+json'}
)
with urllib.request.urlopen(req) as r:
    file_sha = json.loads(r.read()).get('sha', '')

body = json.dumps({'message': 'Auto update history.json [skip ci]', 'content': base64.b64encode(slim_raw).decode(), 'sha': file_sha}).encode()
req2 = urllib.request.Request(
    f'https://api.github.com/repos/{repo}/contents/history.json',
    data=body, method='PUT',
    headers={'Authorization': f'token {token}', 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json'}
)
with urllib.request.urlopen(req2) as r:
    result = json.loads(r.read())
    print('SUCCESS' if 'content' in result else f'FAILED: {result.get("message")}')
"

      
      - name: Upload history.json to GitHub Releases
        run: |
          TSTAMP=$(TZ='America/New_York' date '+%Y-%m-%d-%H%M')
          RELEASE_ID=$(curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Content-Type: application/json" https://api.github.com/repos/${{ github.repository }}/releases -d "{\"tag_name\":\"snapshot-${TSTAMP}\",\"name\":\"Snapshot ${TSTAMP} ET\",\"body\":\"Automated snapshot\"}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Content-Type: application/json" --data-binary @history.json "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=history.json"
          echo "Uploaded to release"

      - name: Commit updated files to repo
        run: |
          git config --global user.name "WPB Scraper Bot"
          git config --global user.email "scraper@wpbwatchco.com"
          rm -f history.json history.json.gz
          git add attribute-cache.json fb-listings.json fb-sync-results.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto update [skip ci] - $(TZ='America/New_York' date '+%Y-%m-%d %I:%M %p ET')"
          git fetch origin main
          git checkout -- .
          git clean -fd
          git rebase origin/main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
