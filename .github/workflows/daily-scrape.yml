name: WPB Daily Inventory Scrape

on:
  schedule:
    - cron: '1 10 * * *'
    - cron: '1 19 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Download history.json from repo
        run: |
          HTTP=$(curl -s -o history.json -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Cache-Control: no-cache" \
            "https://raw.githubusercontent.com/${{ github.repository }}/main/history.json")
          if [ "$HTTP" = "200" ]; then
            echo "Downloaded history.json OK"
          else
            echo "Starting fresh - no history"
            echo "{}" > history.json
          fi

      - name: Run inventory scraper (with retry)
        env:
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
        run: |
          for attempt in 1 2 3; do
            echo "Scraper attempt $attempt of 3..."
            node scrape.js && break
            if [ $attempt -lt 3 ]; then
              echo "Attempt $attempt failed, waiting 60s before retry..."
              sleep 60
            else
              echo "All 3 attempts failed"
              exit 1
            fi
          done

      - name: Run FB Marketplace scraper
        continue-on-error: true
        run: node fb-scraper.js 2>/dev/null || echo "FB scraper skipped"

      - name: Run FB sync check
        continue-on-error: true
        run: node fb-sync.js 2>/dev/null || echo "FB sync skipped"

      - name: Push history.json to repo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Build slim history: last 20 daily snapshots from disk file
          python3 -c "
import json, base64, sys
with open('history.json') as f:
    h = json.load(f)
keys = sorted(h.keys())
by_day = {}
for k in keys:
    d = k[:10]
    if d not in by_day or k > by_day[d]:
        by_day[d] = k
keep = sorted(by_day.values())[-20:]
slim = {k: h[k] for k in keep}
slim_b64 = base64.b64encode(json.dumps(slim).encode()).decode()
print(f'Snapshots: {len(slim)}, latest: {sorted(slim.keys())[-1]}', file=sys.stderr)
print(slim_b64)
" > /tmp/slim_b64.txt 2>/tmp/push_info.txt
          cat /tmp/push_info.txt

          # Get current SHA
          FILE_SHA=$(curl -s -H "Authorization: token ${{ secrets.GH_TOKEN }}"             -H "Accept: application/vnd.github.v3+json"             "https://api.github.com/repos/${{ github.repository }}/contents/history.json"             | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))")
          echo "Current SHA: $FILE_SHA"

          # Build payload and push
          TIMESTAMP=$(TZ='America/New_York' date '+%Y-%m-%d %I:%M %p ET')
          python3 -c "
import json, sys
slim_b64 = open('/tmp/slim_b64.txt').read().strip()
sha = sys.argv[1]
payload = {'message': 'Auto update history.json [skip ci]', 'content': slim_b64}
if sha: payload['sha'] = sha
print(json.dumps(payload))
" "$FILE_SHA" > /tmp/payload.json

          RESULT=$(curl -s -X PUT             -H "Authorization: token ${{ secrets.GH_TOKEN }}"             -H "Content-Type: application/json"             -H "Accept: application/vnd.github.v3+json"             -d @/tmp/payload.json             "https://api.github.com/repos/${{ github.repository }}/contents/history.json")

          echo "$RESULT" | python3 -c "
import sys, json
r = json.load(sys.stdin)
if 'content' in r:
    print('SUCCESS: SHA=' + r['content']['sha'][:8])
else:
    print('FAILED:', r.get('message','unknown'))
    sys.exit(1)
"

      - name: Upload history.json to GitHub Releases
        run: |
          TSTAMP=$(TZ='America/New_York' date '+%Y-%m-%d-%H%M')
          RELEASE_ID=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d "{\"tag_name\":\"snapshot-${TSTAMP}\",\"name\":\"Snapshot ${TSTAMP} ET\",\"body\":\"Automated snapshot\"}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @history.json \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=history.json"
          echo "Uploaded to release snapshot-${TSTAMP}"

      - name: Commit small files to repo
        run: |
          git config --global user.name "WPB Scraper Bot"
          git config --global user.email "scraper@wpbwatchco.com"
          rm -f history.json
          git add attribute-cache.json fb-listings.json fb-sync-results.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto update [skip ci] - $(TZ='America/New_York' date '+%Y-%m-%d %I:%M %p ET')"
          git fetch origin main
          git checkout -- .
          git clean -fd
          git rebase origin/main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
